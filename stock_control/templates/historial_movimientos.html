<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Movimientos</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="page-transition">

    <div class="header">
        <h1>Historial de Movimientos</h1>
    </div>
    
    <div class="container">
        <ul class="mov-list">
            {% for movimiento in movimientos %}
            <li class="mov-item">
                <strong>#{{ movimiento.grupo_id }}</strong> - {{ movimiento.tipo }} - {{ movimiento.timestamp|date:"d/m/Y H:i" }}
                <div class="mov-buttons">
                    <button class="btn-view" onclick="verDetalleMovimiento('{{ movimiento.grupo_id }}')">Ver Detalles</button>
                    <button class="btn-delete" onclick="confirmarEliminacion('{{ movimiento.grupo_id }}')">🗑</button>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>

    <!-- Modal de Detalle de Movimiento -->
    <div id="detalleModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarDetalle()">&times;</span>
            <h2>Detalle de Movimiento <strong id="detalleGrupoId"></strong></h2>
            <ul id="detalleLista"></ul>
            <button class="btn-close" onclick="cerrarDetalle()">Cerrar</button>
        </div>
    </div>

    <!-- Modal de Confirmación de Eliminación -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarConfirmacion()">&times;</span>
            <h2>¿Estás seguro?</h2>
            <p>Esta acción no se puede deshacer.</p>
            <div class="modal-buttons">
                <button class="btn-delete" id="confirmDelete">Eliminar</button>
                <button class="btn-close" onclick="cerrarConfirmacion()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
    let movimientoAEliminar = null;

    function verDetalleMovimiento(grupoId) {
        document.getElementById("detalleGrupoId").textContent = `#${grupoId}`;
        fetch(`/detalle_movimiento/${grupoId}/`)
            .then(response => response.json())
            .then(data => {
                const detalleLista = document.getElementById("detalleLista");
                detalleLista.innerHTML = "";
                data.forEach(item => {
                    const li = document.createElement("li");
                    li.innerHTML = `<span class="producto">${item.producto}</span>
                                    <span class="peso">Peso: ${item.peso}g</span>
                                    <span class="tipo">Tipo: ${item.tipo}</span>
                                    <span class="fecha">Fecha: ${item.fecha}</span>`;
                    
                    li.onclick = function() {
                        resaltarElemento(li);
                    };

                    detalleLista.appendChild(li);
                });
                document.getElementById("detalleModal").style.display = "flex";
            });
    }

    function resaltarElemento(element) {
        document.querySelectorAll("#detalleLista li").forEach(li => li.classList.remove("resaltado"));
        element.classList.add("resaltado");
    }

    function cerrarDetalle() {
        document.getElementById("detalleModal").style.display = "none";
    }

    function confirmarEliminacion(grupoId) {
        movimientoAEliminar = grupoId;
        document.getElementById("confirmModal").style.display = "flex";
    }

    function cerrarConfirmacion() {
        movimientoAEliminar = null;
        document.getElementById("confirmModal").style.display = "none";
    }

    document.getElementById("confirmDelete").addEventListener("click", function() {
        if (movimientoAEliminar) {
            fetch(`/eliminar_movimiento/${movimientoAEliminar}/`, { method: "DELETE" })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        location.reload();
                    } else {
                        alert("Error al eliminar el movimiento.");
                    }
                })
                .catch(error => console.error("Error:", error));
        }
        cerrarConfirmacion();
    });
    </script>

</body>
</html>
